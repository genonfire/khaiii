name: build-macos-arm64

# Builds khaiii v0.4 natively on a GitHub-hosted Apple Silicon runner and smoke-tests the
# extracted archive on every PR update. Publishing a Release is manual (workflow_dispatch)
# and only honoured on the default branch, after merge.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (only used when publish=true), e.g. v0.4-macos-arm64.1"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub Release (only honoured on the default branch)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-macos-arm64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      RUNNER_LABEL: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Pin CMake
        run: |
          . scripts/macos/env.sh
          python3 -m pip install "cmake==${CMAKE_PIN}"
          hash -r

      - name: Host check (fail closed unless Darwin/arm64)
        run: scripts/macos/check_host.sh

      - name: Verify source integrity
        run: |
          . scripts/macos/env.sh
          git cat-file -e "${UPSTREAM_COMMIT}^{commit}"
          git merge-base --is-ancestor "$UPSTREAM_COMMIT" HEAD
          echo "upstream ${UPSTREAM_TAG}: ${UPSTREAM_COMMIT}"
          echo "fork HEAD: $(git rev-parse HEAD)"
          echo "fork commits on top of upstream:"; git log --oneline "${UPSTREAM_COMMIT}..HEAD"
          # the base model and compiled-resource inputs must be byte-identical to upstream v0.4
          git diff --stat --exit-code "$UPSTREAM_COMMIT" HEAD -- rsc src/main/cpp src/main/python include

      - name: Build libkhaiii.dylib + base model resources
        run: scripts/macos/build.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/build"

      - name: Verify Mach-O arm64 / install name / dependencies
        run: scripts/macos/verify_binary.sh "$RUNNER_TEMP/build/lib/libkhaiii.dylib"

      - name: Package
        run: scripts/macos/package.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/build" "$RUNNER_TEMP/out"

      - name: Verify packaged library (post install_name_tool / strip / codesign)
        run: |
          . scripts/macos/env.sh
          scripts/macos/verify_binary.sh "$RUNNER_TEMP/out/stage/$PKG_NAME/lib/libkhaiii.dylib"
          codesign --verify --verbose "$RUNNER_TEMP/out/stage/$PKG_NAME/lib/libkhaiii.dylib"
          if strings "$RUNNER_TEMP/out/stage/$PKG_NAME/lib/libkhaiii.dylib" | grep -E "$GITHUB_WORKSPACE|$RUNNER_TEMP|/Users/runner"; then
            echo "FATAL: runner paths embedded in library" >&2; exit 1
          fi

      - name: Smoke test the extracted archive only
        run: |
          . scripts/macos/env.sh
          FRESH="$(mktemp -d)"
          cp "$RUNNER_TEMP/out/$PKG_NAME.tar.gz" "$RUNNER_TEMP/out/$PKG_NAME.tar.gz.sha256" "$FRESH/"
          cp scripts/macos/smoke_test.py "$FRESH/"      # the only repo file used: the test itself
          cd "$FRESH"
          shasum -a 256 -c "$PKG_NAME.tar.gz.sha256"
          tar -xzf "$PKG_NAME.tar.gz"
          ( cd "$PKG_NAME" && shasum -a 256 -c MANIFEST.sha256 )
          cd /                                          # not inside the checkout / build dir
          env -i PATH="$(dirname "$(command -v python3)"):/usr/bin:/bin" HOME="$FRESH" \
              python3 "$FRESH/smoke_test.py" "$FRESH/$PKG_NAME" "$KHAIII_VERSION"

      - name: Summary
        run: |
          . scripts/macos/env.sh
          { echo "### $PKG_NAME"; echo '```'; cat "$RUNNER_TEMP/out/$PKG_NAME.tar.gz.sha256"; echo '```'
            echo '```json'; cat "$RUNNER_TEMP/out/$PKG_NAME.provenance.json"; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: khaiii-macos-arm64
          path: |
            ${{ runner.temp }}/out/*.tar.gz
            ${{ runner.temp }}/out/*.sha256
            ${{ runner.temp }}/out/*.provenance.json
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    # Only from the reviewed/merged default branch, only when explicitly requested.
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: release       # configure required reviewers on this environment
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: khaiii-macos-arm64
          path: dist
      - name: Verify and publish
        env:
          TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || { echo "invalid release_tag: '$TAG'" >&2; exit 1; }
          cd dist && sha256sum -c ./*.tar.gz.sha256 && cd ..
          cat > notes.md <<NOTES
          Native **macOS arm64** build of Kakao khaiii v0.4 (upstream commit fa5fbd10aeddfe97cd7aa87faee39628e5e9c18a)
          with build-compatibility changes only. Same upstream base model; not a new morphological model.

          - Install/usage: see INSTALL.md inside the archive.
          - Provenance & digests: \`*.provenance.json\`; archive digest in \`*.sha256\`.
          - Built and smoke-tested on GitHub \`macos-15\` (Apple Silicon): [workflow run]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID).
          - **Not Developer-ID signed and not Apple-notarized** (ad-hoc signature only).

          \`\`\`
          $(cat dist/*.tar.gz.sha256)
          \`\`\`
          NOTES
          gh release create "$TAG" dist/* --repo "$REPO" --target "$SHA" \
             --title "khaiii v0.4 macOS arm64 ($TAG)" --notes-file notes.md
